name: Enable central feedback loop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-feedback:
    if: github.event.head_commit.message != 'Enable central feedback loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch feedback submission
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '/api/feedback' in s:
              raise SystemExit(0)
          old = """function save(x){const a=JSON.parse(localStorage.getItem('metro_material_feedback')||'[]');a.push(x);localStorage.setItem('metro_material_feedback',JSON.stringify(a))}"""
          new = """async function save(x){
            const payload={...x,clientAt:new Date().toISOString()};
            try{
              const response=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true});
              if(!response.ok) throw new Error('Feedback API '+response.status);
              return true;
            }catch(error){
              const a=JSON.parse(localStorage.getItem('metro_material_feedback')||'[]');
              a.push({...payload,syncError:String(error)});
              localStorage.setItem('metro_material_feedback',JSON.stringify(a));
              return false;
            }
          }"""
          if old not in s:
              raise SystemExit('Expected save function not found; no changes made.')
          s=s.replace(old,new,1)
          s=s.replace("function correct(i){save({query:lastQuery,parsed,material:materials[i],correct:true,at:new Date().toISOString()});document.getElementById(\"panel\").innerHTML='<div class=\"card question\"><div class=\"eyebrow\">Saved</div><h2>Thanks — feedback recorded.</h2><p class=\"muted\">The material master was not changed.</p></div>'}", "async function correct(i){const ok=await save({query:lastQuery,parsed,material:materials[i],correct:true,feedbackType:'correct'});document.getElementById(\"panel\").innerHTML='<div class=\"card question\"><div class=\"eyebrow\">Feedback recorded</div><h2>Thanks — feedback recorded.</h2><p class=\"muted\">'+(ok?'Your feedback reached the central service.':'Saved locally because the service was unavailable.')+'</p></div>'}")
          s=s.replace("function wrong(i,reason){save({query:lastQuery,parsed,material:materials[i],correct:false,reason,at:new Date().toISOString()});document.getElementById(\"panel\").innerHTML='<div class=\"card question\"><div class=\"eyebrow\">Feedback saved</div><h2>Got it.</h2><p class=\"muted\">We’ll use this correction when the central learning layer is connected.</p></div>'}", "async function wrong(i,reason){const ok=await save({query:lastQuery,parsed,material:materials[i],correct:false,reason,feedbackType:'wrong'});document.getElementById(\"panel\").innerHTML='<div class=\"card question\"><div class=\"eyebrow\">Feedback recorded</div><h2>Got it.</h2><p class=\"muted\">'+(ok?'Your feedback reached the central service.':'Saved locally because the service was unavailable.')+'</p></div>'}")
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable central feedback loop"
          git push
