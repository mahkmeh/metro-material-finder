name: Add correction feedback flow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Material Finder correction flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'function chooseCandidate' in s:
              print('Correction flow already patched.')
              raise SystemExit(0)

          old = bytes.fromhex('3c627574746f6e206f6e636c69636b3d2272656e64657242657374286c617374526573756c74735b247b6964787d5d2c6c617374526573756c747329223e43686f6f73653c2f627574746f6e3e').decode()
          new = bytes.fromhex('3c627574746f6e206f6e636c69636b3d2263686f6f736543616e646964617465286c617374526573756c74735b247b6964787d5d29223e43686f6f73653c2f627574746f6e3e').decode()
          if old not in s:
              raise SystemExit('Could not find candidate Choose button')
          s = s.replace(old, new, 1)

          marker = bytes.fromhex('66756e6374696f6e207573654578616d706c652878297b646f63756d656e742e676574456c656d656e744279496428227122292e76616c75653d783b66696e644d6174657269616c28297d').decode()
          addition = bytes.fromhex('').decode()
          if marker not in s:
              raise SystemExit('Could not find insertion marker')
          s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Add candidate correction feedback flow'
          git push
