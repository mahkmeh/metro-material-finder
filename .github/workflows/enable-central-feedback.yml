name: Enable central feedback

on:
  push:
    paths:
      - 'scripts/enable-central-feedback.py'
      - '.github/workflows/enable-central-feedback.yml'
      - 'api/feedback.js'
      - 'package.json'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch feedback storage
        run: python3 scripts/enable-central-feedback.py

      - name: Commit index change
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect material finder feedback to Vercel Blob"
          git push
